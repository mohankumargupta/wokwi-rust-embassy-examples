[package]
edition = "2021"
name = "esp32-examples"
version = "0.1.0"

[[bin]]
name = "hello-world"
path = "./src/bin/01-hello-world/main.rs"

[dependencies]
esp-hal = { version = "0.23.1", features = ["esp32"] }
esp-backtrace = { version = "0.15.0", features = [
    "esp32",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.13.0", features = ["esp32", "log"] }
log = { version = "0.4.22" }

[build-dependencies]
toml = "0.8.20"
build-print = "0.1.1"

